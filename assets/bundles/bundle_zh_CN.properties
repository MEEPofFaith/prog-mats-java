# 效果

block.prog-mats-core-cripple.name = 核心：碎裂  
block.prog-mats-core-cripple.description = 基地的核心。一旦被摧毁，该区域将失守。\n体积小且生产成本极低。不提供任何其他优势。  
block.prog-mats-core-cripple.details = ……你说我们燃料不够是什么意思-  

block.prog-mats-core-covalence.name = 核心：共价  
block.prog-mats-core-covalence.description = 并非真正的核心，而是用于与基地核心之间传送物品的链接。不增加核心存储容量。\n需要大量电力运行。  

block.prog-mats-fence.name = 围栏  
block.prog-mats-fence.description = 在连接的节点之间释放能量，对沿途的敌方单位造成伤害。\n不传输电力。\n两侧供电可加倍效果。\n\n射程更长、伤害更高，但连接数较少。  
block.prog-mats-web.name = 蛛网  
block.prog-mats-web.description = 在连接的节点之间释放能量，对沿途的敌方单位造成伤害。\n不传输电力。\n两侧供电可加倍效果。\n\n射程较短、伤害较低，但连接数更多。  

block.prog-mats-shield-projector.name = 护盾投射器  
block.prog-mats-shield-projector.description = 在自身周围生成方形力场，保护内部的建筑和单位免受伤害。\n承受过多伤害时会过热。可选择使用冷却剂防止过热。同时使用相位织物和腾能合金可扩大护盾范围。\n与普通力场投射器不同，它以爆发形式再生。\n\n[orange]能够阻挡[red]弹道导弹[]。  
block.prog-mats-shield-projector.details = 之所以是方形而不是六边形，是因为我懒得计算合适的半径让它完美贴合。  

