#### 模块（小型）  
block.prog-mats-coil.name = 线圈  
block.prog-mats-coil.description = 向敌人目标发射扭曲的四联子弹。\n[accent]需放置在模块化炮塔平台上才能运作。  
block.prog-mats-skeet.name = 警戒  
