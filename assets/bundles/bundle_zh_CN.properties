block.prog-mats-burst.name = 灼流  
block.prog-mats-burst.description = 释放大量蒸汽，伤害并击退敌人目标。\n[accent]需放置在模块化炮塔平台上才能运作。  
block.prog-mats-augment.name = 再生驱动模块  
block.prog-mats-augment.description = 缓慢修复平台并提高其他模块的速度。\n[accent]需放置在模块化炮塔平台上才能运作。\n每平台限1个。  
#### 模块（中型）  
block.prog-mats-abyss.name = 暗影  
block.prog-mats-abyss.description = 将能量爆发集中到敌人目标上。穿透护甲。\n[accent]需放置在模块化炮塔平台上才能运作。  
block.prog-mats-gravity.name = 涌流  
block.prog-mats-gravity.description = 发射牵引锥，吸入所有被卷入的空中目标。\n[accent]需放置在模块化炮塔平台上才能运作。  
#### 模块（大型）  
block.prog-mats-firestorm.name = 火风暴  
block.prog-mats-firestorm.description = 向敌人目标发射短程[red]弹道导弹[]齐射。只能瞄准超出较小最小距离的敌人。\n[accent]需放置在模块化炮塔平台上才能运作。  
block.prog-mats-firestorm.details = 它回来了！  

